<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>口算闯关 · 81 以内加减乘除</title>
<style>
:root{
  --bg:#eef2ff; --card:#fff; --ink:#1e293b; --muted:#64748b;
  --primary:#4f46e5; --primary-d:#4338ca; --ok:#16a34a; --ok-bg:#dcfce7;
  --bad:#dc2626; --bad-bg:#fee2e2; --warn:#f59e0b; --line:#e2e8f0;
  --shadow:0 6px 18px rgba(30,41,59,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
  min-height:100vh;padding-bottom:24px;
}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hidden{display:none !important}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h1{font-size:23px;margin:6px 0 2px;letter-spacing:.5px}
h2{font-size:16px;margin:0 0 10px;color:#334155}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{
  min-height:50px;padding:0 18px;border-radius:14px;border:2px solid transparent;
  font-size:16px;font-weight:700;cursor:pointer;background:#e2e8f0;color:var(--ink);
  transition:transform .06s ease,filter .15s ease;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line)}
.btn-warn{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 24px rgba(79,70,229,.28);margin-bottom:12px}
.hero h1{color:#fff;margin:0 0 4px}
.hero .sub{color:rgba(255,255,255,.82);margin:0;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;
  font-weight:700;cursor:pointer;color:#64748b;transition:all .12s ease;user-select:none;
}
.chip.on{border-color:var(--primary);background:#eef2ff;color:var(--primary)}
.chip input{display:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{
  min-height:44px;border-radius:12px;border:2px solid var(--line);
  background:#fff;font-size:16px;font-weight:800;color:#475569;cursor:pointer;
}
.seg button.on{border-color:var(--primary);background:var(--primary);color:#fff}
.switchline{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
.switchline input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary)}
.switchline b{font-size:15px;display:block}
.switchline span.d{font-size:12px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.best{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.startrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start-btn{
  min-height:74px;border-radius:16px;border:none;cursor:pointer;color:#fff;
  font-size:17px;font-weight:800;letter-spacing:.5px;line-height:1.3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.start-btn small{font-size:11px;font-weight:500;opacity:.9}
.start-btn.t{background:linear-gradient(135deg,#4f46e5,#6366f1);box-shadow:0 6px 16px rgba(79,70,229,.28)}
.start-btn.s{background:linear-gradient(135deg,#0d9488,#14b8a6);box-shadow:0 6px 16px rgba(13,148,136,.25)}
.start-btn.r{background:linear-gradient(135deg,#b45309,#f59e0b);box-shadow:0 6px 16px rgba(180,83,9,.25)}
.start-btn:active{transform:scale(.985)}
.start-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.hintline{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:rgba(238,242,255,.94);backdrop-filter:blur(6px);padding:6px 0 8px;margin-bottom:4px}
.hud-inner{display:flex;gap:4px;align-items:center;background:#fff;border-radius:16px;padding:7px 10px;box-shadow:var(--shadow)}
.hud-item{display:flex;flex-direction:column;align-items:center;min-width:44px}
.hud-k{font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap}
.hud-v{font-size:17px;font-weight:800;line-height:1.25;white-space:nowrap}
.hud-v.warn{color:var(--bad)}

/* ---------- 答题区 ---------- */
.qcard{position:relative;overflow:hidden}
.qlabel{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.lvpill{background:#eef2ff;color:var(--primary);border-radius:999px;padding:2px 9px;font-weight:800;font-size:11px}
.timerbar{height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:8px 0 4px}
.timerbar > div{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .1s linear}
.timerbar.low > div{background:linear-gradient(90deg,#f97316,#ef4444)}
.tnum{font-size:12px;color:var(--muted);text-align:right;height:16px}
.expr{
  text-align:center;font-size:clamp(30px,9vw,44px);font-weight:900;letter-spacing:2px;
  margin:14px 0 12px;line-height:1.25;word-break:break-word;
}
.ansbox{
  min-height:66px;border-radius:16px;border:3px dashed #c7d2fe;background:#f8faff;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:var(--primary);letter-spacing:3px;
}
.ansbox.empty{color:#c7d2fe}
.ansbox.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg);animation:pop .38s ease}
.ansbox.bad{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-bg);animation:shake .4s ease}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px auto 0;max-width:520px}
.key{
  min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;
  font-size:23px;font-weight:800;color:var(--ink);cursor:pointer;
  transition:transform .05s ease,background .1s ease;
}
.key:active{transform:scale(.96);background:#eef2ff}
.key.del{background:#fff7ed;border-color:#fdba74;color:#9a3412;font-size:17px}
.key.ok{background:var(--primary);border-color:var(--primary);color:#fff;font-size:18px}
.key:disabled{opacity:.4}

/* ---------- 反馈 ---------- */
.feedback{min-height:24px;text-align:center;font-weight:900;font-size:16px;margin-top:10px}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.float{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--ok);pointer-events:none;animation:floatUp .9s ease forwards}
.explain{border-radius:16px;background:#fff1f2;border:2px solid #fecaca;padding:13px;margin-top:12px;animation:slideDown .26s ease}
.explain h3{margin:0 0 8px;font-size:17px;color:var(--bad)}
.explain .step{font-size:16px;font-weight:700;color:#334155;margin:5px 0}
.explain .step b{color:var(--primary)}
.explain .mine{color:var(--bad)}
.explain .ansline{font-size:19px;font-weight:900;color:#0f172a;background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.confetti{position:absolute;width:8px;height:13px;border-radius:2px;pointer-events:none;animation:fall .95s ease-out forwards}
@keyframes fall{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}
@keyframes pop{0%{transform:scale(.86)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,12px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
@keyframes slideDown{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
.anim-in{animation:fadeUp .22s ease}
.qcard.shake{animation:shake .34s ease}

/* ---------- 结算 ---------- */
.big-title{font-size:26px;font-weight:900;text-align:center;margin:6px 0 4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:#f8fafc;border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:21px}
.stat span{font-size:11px;color:var(--muted)}
.badge{display:inline-block;background:#eef2ff;color:var(--primary);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.newrec{text-align:center;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:8px;font-weight:800;font-size:14px;margin-bottom:10px}
@media (max-width:400px){
  .chips{gap:6px}
  .chip{padding:0 9px;font-size:14px;min-height:42px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 首页 ============ -->
  <section id="scr-home" class="screen active">
    <div class="hero">
      <h1>口算闯关</h1>
      <p class="sub">81 以内加减乘除 · 每一步都是正整数</p>
    </div>

    <div class="card">
      <h2>题目类型</h2>
      <div class="chips" id="kindChips">
        <button type="button" class="chip on" data-k="+">加法 +</button>
        <button type="button" class="chip on" data-k="-">减法 −</button>
        <button type="button" class="chip on" data-k="×">乘法 ×</button>
        <button type="button" class="chip on" data-k="÷">除法 ÷</button>
      </div>
      <div style="margin-top:12px">
        <label class="switchline" for="mixToggle">
          <input type="checkbox" id="mixToggle">
          <span><b>加减和乘除出现在同一题</b><span class="d">例如 6×3−5、24÷6+7。默认关闭，只在同时选了加减和乘除时生效。</span></span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>每题限时（计时模式）</h2>
      <div class="seg" id="limitSeg"></div>
      <p class="sub" style="margin:8px 0 0">3 / 5 / 8 / 10 / 12 / 15 / 18 / 20 秒可选。计时模式共 2 分钟，每题单独限时，超时算答错；积分模式不限时。</p>
    </div>

    <div class="card">
      <h2>难度</h2>
      <div class="row">
        <select id="diffSel" style="min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;font-size:15px;font-family:inherit">
          <option value="0">自动递进（答对 3 题升级）</option>
          <option value="1">固定 Lv1 · 一位数</option>
          <option value="2">固定 Lv2 · 两位数与一位数</option>
          <option value="3">固定 Lv3 · 两位数</option>
          <option value="4">固定 Lv4 · 三个数</option>
          <option value="5">固定 Lv5 · 四个数 / 连乘连除</option>
        </select>
      </div>
      <p class="sub" id="lvDesc" style="margin:8px 0 0">Lv1 一位数 → Lv2 几十 ± 一位数 → Lv3 两位数 → Lv4 三个数（24−15+5）→ Lv5 四个数</p>
      <div style="margin-top:12px">
        <label class="switchline" for="soundToggle">
          <input type="checkbox" id="soundToggle" checked>
          <span><b>答对/答错提示音</b><span class="d">关掉就只剩动画。</span></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="startrow">
        <button class="start-btn t" id="btnTime">计时模式<small>2 分钟 · 拼答对数</small></button>
        <button class="start-btn s" id="btnScore">积分模式<small>不限时 · 一直做</small></button>
        <button class="start-btn r" id="btnRecite" style="grid-column:1/-1">乘法口诀背诵<small>45 句 · 1×1 到 9×9 · 只比用时</small></button>
      </div>
      <div class="best" id="bestLine">还没有记录</div>
      <p class="hintline" id="kindHint"></p>
    </div>
  </section>

  <!-- ============ 答题 ============ -->
  <section id="scr-game" class="screen">
    <header class="hud">
      <div class="hud-inner">
        <div class="hud-item"><span class="hud-k" id="hudK1">剩余</span><span class="hud-v" id="hudV1">2:00</span></div>
        <div class="hud-item"><span class="hud-k" id="hudK2">得分</span><span class="hud-v" id="hudScore">0</span></div>
        <div class="hud-item"><span class="hud-k">答对</span><span class="hud-v" id="hudRight">0</span></div>
        <div class="hud-item"><span class="hud-k">答错</span><span class="hud-v" id="hudWrong">0</span></div>
        <div class="hud-item"><span class="hud-k">连对</span><span class="hud-v" id="hudCombo">0</span></div>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" id="btnQuit">结束</button>
      </div>
    </header>

    <div class="card qcard" id="qcard">
      <div class="qlabel">
        <span id="qLabel">第 1 题</span>
        <span class="lvpill" id="lvPill">Lv 1</span>
      </div>
      <div class="timerbar" id="timerBar"><div id="timerFill"></div></div>
      <div class="tnum" id="tnum"></div>
      <div class="expr" id="expr">5 + 4 =</div>
      <div class="ansbox empty" id="ansBox">?</div>
      <div class="pad" id="pad">
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button class="key del" data-d="del">删除</button>
        <button class="key" data-d="0">0</button>
        <button class="key ok" data-d="ok">确定</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="explain hidden" id="explain"></div>
      <div class="row" id="nextRow" style="margin-top:10px;display:none">
        <button class="btn btn-primary btn-block" id="btnNext">下一题</button>
      </div>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="scr-result" class="screen">
    <div class="card">
      <div class="big-title" id="resTitle">时间到</div>
      <div style="text-align:center"><span class="badge" id="resMode">计时模式</span></div>
      <div class="newrec hidden" id="newRec">新纪录！</div>
      <div class="stat-grid">
        <div class="stat"><b id="resRight">0</b><span>答对</span></div>
        <div class="stat"><b id="resWrong">0</b><span>答错</span></div>
        <div class="stat"><b id="resRate">—</b><span>正确率</span></div>
        <div class="stat"><b id="resScore">0</b><span id="resScoreK">得分</span></div>
        <div class="stat"><b id="resCombo">0</b><span>最高连对</span></div>
        <div class="stat"><b id="resAvg">—</b><span>平均每题</span></div>
      </div>
      <div class="best" id="resBest"></div>
      <div class="startrow" style="margin-top:14px">
        <button class="start-btn t" id="btnAgain">再来一局<small id="againSub">同样的设置</small></button>
        <button class="btn btn-ghost" id="btnHome" style="min-height:74px;border-radius:16px">回到首页</button>
      </div>
      <button class="btn btn-ghost btn-block" id="btnExport" style="margin-top:10px;min-height:52px;border-radius:14px">导出错题（txt）</button>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function rpick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function show(id){
  var ss = document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++) ss[i].className = 'screen';
  var el = $(id); if(el) el.className = 'screen active';
  window.scrollTo(0,0);
}

var MAXV = 81;

/* 乘法口诀表里的积（去重） */
var TABLE = (function(){
  var seen={}, out=[];
  for(var a=1;a<=9;a++){
    for(var b=1;b<=9;b++){
      var p=a*b;
      if(!seen[p]){ seen[p]=1; out.push(p); }
    }
  }
  out.sort(function(x,y){return x-y;});
  return out;
})();

/* 逐步求值：每一步必须是 1..81 的整数，除法必须整除 */
function evalSeq(nums, ops){
  var cur = nums[0];
  if(!(cur>=1 && cur<=MAXV)) return null;
  var steps = [];
  for(var i=0;i<ops.length;i++){
    var b = nums[i+1], op = ops[i], v;
    if(!(b>=1 && b<=MAXV)) return null;
    if(op==='+'){ v = cur + b; }
    else if(op==='-'){ v = cur - b; }
    else if(op==='×'){ v = cur * b; }
    else if(op==='÷'){ if(cur % b !== 0) return null; v = cur / b; }
    else { return null; }
    if(v !== Math.floor(v) || v < 1 || v > MAXV) return null;
    steps.push({e: cur + ' ' + op + ' ' + b, v: v});
    cur = v;
  }
  return {answer: cur, steps: steps};
}

function mk(nums, ops){
  var r = evalSeq(nums, ops);
  if(!r) return null;
  var parts = [];
  for(var i=0;i<nums.length;i++){
    parts.push(nums[i]);
    if(i < ops.length) parts.push(ops[i]);
  }
  return {text: parts.join(' '), answer: r.answer, steps: r.steps,
          nums: nums.slice(), ops: ops.slice()};
}

function tryGen(fn){
  for(var i=0;i<400;i++){
    var q = fn();
    if(q) return q;
  }
  return null;
}

/* 按「先乘除、后加减」求值（混合运算专用）
   先算所有 × ÷（从左到右），再算 + −（从左到右）。
   每一步依然要求 1..81 的整数，除法必须整除。
   这样得到的分步顺序就是课堂上讲的顺序，孩子按优先级算也能对上。 */
function evalP(nums, ops){
  var ns = nums.slice(), os = ops.slice(), steps = [];

  for(var i=0;i<os.length;i++){
    if(os[i] === '×' || os[i] === '÷'){
      var a = ns[i], b = ns[i+1], v;
      if(!(a>=1 && a<=MAXV) || !(b>=1 && b<=MAXV)) return null;
      if(os[i] === '×'){ v = a * b; }
      else { if(a % b !== 0) return null; v = a / b; }
      if(v !== Math.floor(v) || v < 1 || v > MAXV) return null;
      steps.push({e: a + ' ' + os[i] + ' ' + b, v: v});
      ns.splice(i, 2, v);
      os.splice(i, 1);
      i--;
    }
  }

  var cur = ns[0];
  if(!(cur>=1 && cur<=MAXV)) return null;
  for(var j=0;j<os.length;j++){
    var b2 = ns[j+1], v2;
    if(!(b2>=1 && b2<=MAXV)) return null;
    if(os[j] === '+'){ v2 = cur + b2; }
    else if(os[j] === '-'){ v2 = cur - b2; }
    else { return null; }
    if(v2 !== Math.floor(v2) || v2 < 1 || v2 > MAXV) return null;
    steps.push({e: cur + ' ' + os[j] + ' ' + b2, v: v2});
    cur = v2;
  }
  return {answer: cur, steps: steps};
}

function mkP(nums, ops){
  var r = evalP(nums, ops);
  if(!r) return null;
  var parts = [];
  for(var i=0;i<nums.length;i++){
    parts.push(nums[i]);
    if(i < ops.length) parts.push(ops[i]);
  }
  return {text: parts.join(' '), answer: r.answer, steps: r.steps,
          nums: nums.slice(), ops: ops.slice()};
}

/* ================= 各题型生成器 ================= */
/* 加法：lv1 个位 → lv2 几十+个位 → lv3 两位数 → lv4 三数 → lv5 四数 */
function genAdd(lv){
  if(lv<=1) return mk([ri(2,9), ri(2,9)], ['+']);
  if(lv===2) return mk([ri(11,70), ri(2,9)], ['+']);
  if(lv===3){ var a=ri(11,66), b=ri(10, MAXV-a); return mk([a,b], ['+']); }
  if(lv===4) return mk([ri(10,40), ri(3,20), ri(2,20)], [rpick(['+','-']), '+']);
  return mk([ri(10,35), ri(3,15), ri(2,15), ri(2,12)], ['+', rpick(['+','-']), '+']);
}

/* 减法：lv1 个位减 → lv2 十几减个位(11-6) → lv3 两位数减两位数(27-15) */
function genSub(lv){
  if(lv<=1){ var a=ri(3,9); return mk([a, ri(1,a-1)], ['-']); }
  if(lv===2) return mk([ri(11,19), ri(2,9)], ['-']);
  if(lv===3){ var a2=ri(20,MAXV); return mk([a2, ri(10,a2-1)], ['-']); }
  if(lv===4) return mk([ri(25,60), ri(6,18), ri(2,12)], ['-', rpick(['+','-'])]);
  return mk([ri(35,70), ri(6,15), ri(3,10), ri(1,8)], ['-', '+', rpick(['-','+'])]);
}

/* 连乘：保证每一步乘积 ≤81 */
function mulChain(n, maxFactor){
  var nums=[], ops=[], cur=1;
  for(var i=0;i<n;i++){
    var hi = Math.min(maxFactor, Math.floor(MAXV/cur));
    if(hi < 2) return null;
    var v = ri(2, hi);
    nums.push(v); ops.push('×'); cur *= v;
  }
  ops.pop();
  return mk(nums, ops);
}
/* 乘法：lv1/2 表内 → lv3+ 三个数 → lv5 四个数 */
function genMul(lv){
  if(lv<=1) return mk([ri(2,9), ri(2,9)], ['×']);
  if(lv===2) return mulChain(2, 9);
  if(lv===3) return mulChain(3, 9);
  if(lv===4) return mulChain(3, 5);
  return mulChain(4, 3);
}

/* 除法：乘法口诀表反着用——除数与商都取 2~9，被除数 = 两者之积。
   所以商永远不超过 9，不会出现 72÷2=36 这种超出口诀表的题。 */
function divOne(minP){
  for(var t=0;t<200;t++){
    var q = ri(2,9), d = ri(2,9);
    var p = q*d;
    if(p < minP || p > MAXV) continue;
    var r = mk([p, d], ['÷']);
    if(r && r.answer <= 9) return r;
  }
  return null;
}

/* 兜底校验：题面里每一步除法（形如 "36 ÷ 4"）的商都必须 ≤9 */
function divQuotientOK(q){
  if(!q || !q.steps) return false;
  for(var i=0;i<q.steps.length;i++){
    var m = /^(\d+)\s*÷\s*(\d+)$/.exec(q.steps[i].e || '');
    if(m){
      var quot = Number(m[1]) / Number(m[2]);
      if(!(quot >= 1) || quot > 9) return false;
    }
  }
  return true;
}

/* 除法：lv1/2 单步 → lv3 两步 → lv4/5 乘除混合；出口统一卡「商 ≤9」 */
function genDiv(lv){
  var q = genDivRaw(lv);
  return divQuotientOK(q) ? q : null;
}
function genDivRaw(lv){
  if(lv<=1) return divOne(4);
  if(lv===2) return divOne(20);
  if(lv===3){
    for(var t=0;t<200;t++){
      var q1 = divOne(12);
      if(!q1) continue;
      var mid = q1.answer, ds=[];
      /* 排除 d===第一步的除数：否则出现 25 ÷ 5 ÷ 5 这种连除同一个数的题 */
      for(var d=2; d<=9; d++){ if(mid % d === 0 && d !== q1.nums[1]) ds.push(d); }
      if(!ds.length) continue;
      var q2 = mk([q1.nums[0], q1.nums[1], rpick(ds)], ['÷','÷']);
      if(q2) return q2;
    }
    return null;
  }
  if(lv===4){
    for(var t2=0;t2<200;t2++){
      var a = ri(2,9), b = ri(2,9);
      var p = a*b;
      var ds2 = [];
      /* 排除 d2===a：否则出现 48 ÷ 8 × 8 这种除完又乘回原数的套路题 */
      for(var d2=2; d2<=9; d2++){ if(p % d2 === 0 && d2 !== a) ds2.push(d2); }
      if(!ds2.length) continue;
      var q3 = mk([p, a, rpick(ds2)], ['÷','×']);
      if(q3) return q3;
    }
    return null;
  }
  /* lv5：两步乘除，除法的商必须 ≤9，且不许原地往返（p÷z×z、x×y÷y） */
  for(var t3=0;t3<400;t3++){
    var x=ri(2,9), y=ri(2,9), z=ri(2,9), w=ri(2,9);
    var p5 = x*y;
    if(p5 % z !== 0) continue;
    var qq = p5 / z;
    if(qq > 9) continue;
    if(Math.random() < 0.5){
      if(w === z) continue;                  // p5 ÷ z × w，w 等于除数就乘回原数
      var q4 = mk([p5, z, w], ['÷','×']);
      if(q4) return q4;
    }else{
      if(z === y) continue;                  // x × y ÷ z，z 等于 y 就回到 x
      var q5 = mk([x, y, z], ['×','÷']);
      if(q5) return q5;
    }
  }
  return null;
}

/* 加减 + 乘除混合（开关打开时才用）
   两种顺序都出，但一律按「先乘除后加减」求值：
     A 型：6 × 3 − 5      （乘除在前）
     B 型：9 + 3 × 4 = 21 （加减在前，先算乘法）
   这样孩子按课堂上的优先级算，与判定结果一致。 */
function genMixed(lv){
  var b1 = ri(2,9), b2 = ri(2,9), p = b1 * b2;
  if(p >= MAXV) return null;

  if(lv <= 2){
    if(Math.random() < 0.5){
      // A 型：a × b ± c
      var c = ri(1, Math.min(30, MAXV - p));
      return mkP([b1, b2, c], ['×', rpick(['+','-'])]);
    }
    // B 型：a ± b × c
    if(Math.random() < 0.5){
      return mkP([ri(1, MAXV - p), b1, b2], ['+', '×']);
    }
    return mkP([ri(p + 1, MAXV), b1, b2], ['-', '×']);
  }

  // lv3 以上：四个数
  if(Math.random() < 0.5){
    // A 型：a × b ± c ± d
    return mkP([b1, b2, ri(1,18), ri(1,12)],
               ['×', rpick(['+','-']), rpick(['+','-'])]);
  }
  // B 型：a ± b × c ± d
  var op1 = rpick(['+','-']);
  var a = (op1 === '+') ? ri(1, MAXV - p) : ri(p + 1, MAXV - 12);
  if(a < 1 || a > MAXV) return null;
  return mkP([a, b1, b2, ri(1,12)], [op1, '×', rpick(['+','-'])]);
}

var G = {
  mode:'time', running:false, paused:false, accepting:false, ended:false,
  score:0, right:0, wrong:0, combo:0, maxCombo:0,
  timeLeft:120000, qLeft:0, qLimit:0,
  q:null, input:'', qStartTime:0, totalUsed:0, answered:0,
  lockUntil:0, wrongList:[],
  /* 口诀背诵模式专用 */
  queue:[], qi:0, elapsed:0
};

function activeKinds(){
  var out = [];
  for(var i=0;i<4;i++){
    var k = ['+','-','×','÷'][i];
    if(S.kinds[k]) out.push(k);
  }
  return out;
}
function currentLevel(){
  if(S.diff > 0) return S.diff;
  return Math.min(5, 1 + Math.floor(G.right / 3));
}

var GEN = {'+': genAdd, '-': genSub, '×': genMul, '÷': genDiv};

function makeQuestion(){
  var kinds = activeKinds();
  var lv = currentLevel();
  var hasAS = (S.kinds['+'] || S.kinds['-']);
  var hasMD = (S.kinds['×'] || S.kinds['÷']);

  if(S.mix && hasAS && hasMD && Math.random() < 0.35){
    var qm = tryGen(function(){ return genMixed(lv); });
    if(qm){ qm.kind = 'mix'; return qm; }
  }
  var k = rpick(kinds);
  var gen = GEN[k];
  var q = tryGen(function(){ return gen(lv); });
  if(!q) q = mk([5,4],['+']);
  q.kind = k;
  return q;
}

}

function paintInput(){

    box.textContent = '?';
    box.className = 'ansbox empty';
  }else{
    box.textContent = G.input;
    box.className = 'ansbox';
  }
}

/* ================= 答题 ================= */
function pressKey(d){
  if(!G.accepting) return;
  if(d === 'del'){
    G.input = G.input.slice(0, -1);
  }else if(d === 'ok'){
    submit();
    return;
  }else{
    if(G.input.length >= 3) return;
    if(G.input === '0' && d !== '0') G.input = '';
    G.input += d;
  }
  paintInput();
}

function submit(){
  if(!G.accepting) return;
  if(G.input === ''){ flash('请先填答案', 'bad'); return; }
  var val = parseInt(G.input, 10);
  var used = Date.now() - G.qStartTime;
  G.totalUsed += used; G.answered++;
  if(val === G.q.answer) onCorrect(used);
  else onWrong(val, false);
}

function onCorrect(){
  G.accepting = false;
  G.right++;
  G.combo++;
  if(G.combo > G.maxCombo) G.maxCombo = G.combo;
  var gain = 10;
  if(G.combo >= 6) gain = 20;
  else if(G.combo >= 3) gain = 15;
  G.score += gain;

  $('ansBox').className = 'ansbox ok';
  $('feedback').textContent = '答对啦 +' + gain;
  $('feedback').className = 'feedback ok';
  confetti();
  floatText('+' + gain);
  sfxOk();
  paintHUD();

  setTimeout(function(){
    if(G.ended) return;
    if(G.mode === 'recite') advanceRecite();
    else nextQuestion();
  }, 720);
}

function onWrong(val, isTimeout){
  if(G.mode === 'recite'){ onWrongRecite(val); return; }
  G.accepting = false;
  G.wrong++;
  G.combo = 0;
  G.paused = (G.mode === 'time');
  /* 记入错题本，结算页可导出 txt */
  G.wrongList.push({
    no: G.right + G.wrong,
    text: G.q.text,
    answer: G.q.answer,
    mine: isTimeout ? null : val,
    timeout: !!isTimeout,
    mix: hasMixOp(G.q),
    steps: (G.q.steps || []).map(function(s){ return {e: s.e, v: s.v}; })
  });

  $('ansBox').className = 'ansbox bad';
  if(!isTimeout) $('ansBox').textContent = String(val);
  $('qcard').className = 'card qcard shake';
  setTimeout(function(){ $('qcard').className = 'card qcard'; }, 400);

  $('feedback').textContent = isTimeout ? '时间到，算答错' : '答错了，看下面';
  $('feedback').className = 'feedback bad';
  sfxBad();

  var html = '';
  if(isTimeout) html += '<h3>时间到！</h3>';
  else html += '<h3>答错了</h3>';
  html += '<div class="ansline">' + esc(G.q.text) + ' = ' + G.q.answer + '</div>';
  if(hasMixOp(G.q)){
    html += '<div class="step" style="color:#7c3aed;font-size:14px">混合运算：先算乘除，再算加减</div>';
  }
  if(isTimeout){
    html += '<div class="step">你还没填完就超时了</div>';
  }else{
    html += '<div class="step">你的答案：<b class="mine">' + val + '</b></div>';
  }
  if(G.q.steps.length > 1){
    for(var i=0;i<G.q.steps.length;i++){
      var st = G.q.steps[i];
      html += '<div class="step">第 ' + (i+1) + ' 步：' + esc(st.e) + ' = <b>' + st.v + '</b></div>';
    }
  }
  if(G.mode === 'time'){
    html += '<div class="step" style="color:#b45309">计时已暂停，点「下一题」继续</div>';
  }else if(G.mode === 'recite'){
    html += '<div class="step" style="color:#b45309">计时不停，点「下一题」继续</div>';
  }
  $('explain').innerHTML = html;
  $('explain').className = 'explain';
  $('pad').classList.add('hidden');
  $('nextRow').style.display = 'flex';
  paintHUD();
}

function hasMixOp(q){
  if(!q || !q.ops) return false;
  var hasMD = false, hasAS = false;
  for(var i=0;i<q.ops.length;i++){
    if(q.ops[i] === '×' || q.ops[i] === '÷') hasMD = true;
    else hasAS = true;
  }
  return hasMD && hasAS;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function flash(txt, cls){
  $('feedback').textContent = txt;
  $('feedback').className = 'feedback ' + (cls||'');
  setTimeout(function(){
    if($('feedback').textContent === txt){
      $('feedback').textContent = '';
      $('feedback').className = 'feedback';
    }
  }, 900);
}

function floatText(txt){
  var box = $('qcard');
  var el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  box.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 950);
}

function confetti(){

  for(var i=0;i<22;i++){

/* ================= 声音 ================= */
var AC = null;
function tone(freq, delay, dur, type){
  if(!S.sound) return;
  try{
    if(!AC){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      AC = new Ctx();
    }
    if(AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    var t = AC.currentTime + delay;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}
function sfxOk(){ tone(660,0,0.12); tone(880,0.09,0.16); }
function sfxBad(){ tone(220,0,0.18,'triangle'); tone(160,0.14,0.22,'triangle'); }

/* ================= 计时 ================= */
var loopId = null, lastT = 0;

function startLoop(){
  lastT = Date.now();
  if(loopId) clearInterval(loopId);
  loopId = setInterval(loop, 80);
}
function stopLoop(){
  if(loopId){ clearInterval(loopId); loopId = null; }
}
function loop(){
  if(!G.running || G.ended || G.paused) { lastT = Date.now(); return; }
  var now = Date.now(), dt = now - lastT;
  lastT = now;
  if(dt < 0) dt = 0;
  if(dt > 500) dt = 500;

  if(G.mode === 'recite'){
    G.elapsed += dt;
    paintHUD();
    if($('tnum')) $('tnum').textContent = '总用时 ' + fmtMs(G.elapsed);
    return;
  }

  if(G.mode === 'time'){
    G.timeLeft -= dt;
    if(G.timeLeft <= 0){
      G.timeLeft = 0;
      paintHUD();
      endGame();
      return;
    }
    if(G.qLimit > 0){
      G.qLeft -= dt;
      var pct = Math.max(0, G.qLeft / G.qLimit * 100);
      $('timerFill').style.width = pct.toFixed(1) + '%';
      $('timerBar').className = 'timerbar' + (pct < 34 ? ' low' : '');
      $('tnum').textContent = Math.ceil(Math.max(0, G.qLeft) / 1000) + ' 秒';
      if(G.qLeft <= 0){
        G.qLeft = 0;
        doTimeout();
        return;
      }
    }
    paintHUD();
  }
}

function doTimeout(){
  if(!G.accepting) return;
  G.totalUsed += S.limit*1000; G.answered++;
  onWrong(null, true);
}

/* ---------- 乘法口诀背诵模式（45 句阶梯顺序，只比用时） ---------- */
function reciteQueue(){
  var out = [];
  for(var a=1;a<=9;a++){
    for(var b=a;b<=9;b++){
      var q = mk([a,b],['×']);
      if(q) out.push(q);
    }
  }
  return out;
}
function fmtMs(ms){
  if(!(ms > 0)) ms = 0;
  var t = Math.floor(ms/100)/10;
  var m = Math.floor(t/60);
  var s = t - m*60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
function startRecite(){
  G.mode = 'recite';
  G.running = true; G.paused = false; G.accepting = false; G.ended = false;
  G.score = 0; G.right = 0; G.wrong = 0; G.combo = 0; G.maxCombo = 0;
  G.timeLeft = 0; G.elapsed = 0;
  G.totalUsed = 0; G.answered = 0; G.retry = 0;
  G.input = ''; G.wrongList = [];
  G.queue = reciteQueue(); G.qi = 0;

  $('hudK1').textContent = '进度';
  $('hudK2').textContent = '用时';
  $('hudV1').textContent = '1/' + G.queue.length;
  $('hudV1').className = 'hud-v';
  $('hudScore').textContent = '0:00.0';
  $('qcard').className = 'card qcard';
  show('scr-game');
  sfxOk();
  nextRecite();
  startLoop();
}
function nextRecite(){
  if(G.ended) return;
  if(G.qi >= G.queue.length){ endRecite(); return; }
  G.q = G.queue[G.qi];
  G.qLimit = 0; G.qLeft = 0;
  G.retry = 0;
  G.input = '';
  lastT = Date.now();
  renderQuestion();
  paintHUD();
}
function advanceRecite(){
  G.qi++;
  G.paused = false;
  lastT = Date.now();
  nextRecite();
}
/* 背诵模式答错：不给答案直接重输，错满 3 次给出答案照输，计时不停 */
function onWrongRecite(val){
  G.wrong++;
  G.combo = 0;
  G.retry = (G.retry || 0) + 1;

  var recorded = false;
  for(var i=0;i<G.wrongList.length;i++){
    if(G.wrongList[i].no === G.qi + 1){ recorded = true; break; }
  }
  if(!recorded){
    G.wrongList.push({
      no: G.qi + 1,
      text: G.q.text,
      answer: G.q.answer,
      mine: val,
      timeout: false,
      mix: false,
      cnt: 1,
      steps: []
    });
  }else{
    for(var j=0;j<G.wrongList.length;j++){
      if(G.wrongList[j].no === G.qi + 1){
        G.wrongList[j].cnt = (G.wrongList[j].cnt || 1) + 1;
        break;
      }
    }
  }

  $('ansBox').className = 'ansbox bad';
  $('qcard').className = 'card qcard shake';
  setTimeout(function(){ $('qcard').className = 'card qcard'; }, 380);
  if(G.retry >= 3){
    $('feedback').textContent = '正确答案是 ' + G.q.answer + '，输入它继续';
  }else{
    $('feedback').textContent = '再想想（第 ' + G.retry + ' 次错，写对才过）';
  }
  $('feedback').className = 'feedback bad';
  sfxBad();
  paintHUD();

  setTimeout(function(){
    if(G.ended) return;
    G.input = '';
    paintInput();
    G.accepting = true;
  }, 420);
}

function startGame(mode){
  if(mode === 'recite'){ startRecite(); return; }
  var kinds = activeKinds();
  if(!kinds.length){ flash2('至少选一种题目类型'); return; }

  G.mode = mode;
  $('hudK2').textContent = '得分';
  $('resScoreK').textContent = '得分';
  $('btnAgain').className = 'start-btn t';
  G.running = true; G.paused = false; G.accepting = false; G.ended = false;
  G.score = 0; G.right = 0; G.wrong = 0; G.combo = 0; G.maxCombo = 0;
  G.timeLeft = 120000;
  G.totalUsed = 0; G.answered = 0;
  G.input = '';
  G.wrongList = [];

  $('hudK1').textContent = (mode === 'time') ? '剩余' : '已答';
  if(mode === 'time'){
    $('hudV1').textContent = '2:00';
    $('timerBar').classList.remove('hidden');
  }else{
    $('hudV1').textContent = '0';
    $('timerBar').classList.add('hidden');
  }
  $('qcard').className = 'card qcard';
  show('scr-game');
  sfxOk();
  nextQuestion();
  startLoop();
}

function nextQuestion(){
  if(G.ended) return;
  G.q = makeQuestion();
  G.qLimit = (G.mode === 'time') ? S.limit*1000 : 0;
  G.qLeft = G.qLimit;
  lastT = Date.now();
  renderQuestion();
  paintHUD();
}

function endGame(){
  if(G.ended) return;
  if(G.mode === 'recite'){ endRecite(); return; }
  G.ended = true; G.running = false; G.accepting = false; G.paused = true;
  stopLoop();

  var answered = G.right + G.wrong;
  var rate = answered ? Math.round(G.right / answered * 100) : 0;
  var avg = answered ? (G.totalUsed / answered / 1000) : 0;

  $('resTitle').textContent = (G.mode === 'time') ? '时间到！' : '本局结束';
  $('resMode').textContent = (G.mode === 'time') ? '计时模式' : '积分模式';
  $('resRight').textContent = G.right;
  $('resWrong').textContent = G.wrong;
  $('resRate').textContent = answered ? rate + '%' : '—';
  $('resScore').textContent = G.score;
  $('resCombo').textContent = G.maxCombo;
  $('resAvg').textContent = answered ? avg.toFixed(1) + 's' : '—';

  var best = loadBest();
  var isNew = false;
  if(G.mode === 'time'){
    if(G.right > best.time){ best.time = G.right; best.timeRate = rate; isNew = true; }
  }else{
    if(G.score > best.score){ best.score = G.score; best.scoreRight = G.right; isNew = true; }
  }
  if(isNew) saveBest(best);
  $('newRec').className = 'newrec' + (isNew ? '' : ' hidden');

  $('resBest').textContent = (G.mode === 'time')
    ? ('最高纪录：答对 ' + best.time + ' 题' + (best.timeRate ? '（正确率 ' + best.timeRate + '%）' : ''))
    : ('最高纪录：' + best.score + ' 分' + (best.scoreRight ? '（答对 ' + best.scoreRight + ' 题）' : ''));
  $('againSub').textContent = (G.mode === 'time') ? '再挑战 2 分钟' : '继续刷分';
  paintExport();
  show('scr-result');
}

/* ---------- 口诀背诵结算 ---------- */
function endRecite(){
  G.ended = true; G.running = false; G.accepting = false; G.paused = true;
  stopLoop();

  var total = G.queue.length;
  var done = G.qi >= total;
  var answered = G.right + G.wrong;
  var rate = answered ? Math.round(G.right / answered * 100) : 0;
  var avg = answered ? (G.totalUsed / answered / 1000) : 0;
  var wrongQ = G.wrongList.length;

  $('resTitle').textContent = done ? '全部背完！' : '提前结束';
  $('resMode').textContent = '口诀背诵 · 完成 ' + Math.min(G.qi, total) + '/' + total + ' 句'
    + (wrongQ ? ' · 错题 ' + wrongQ + ' 句' : '');
  $('resRight').textContent = G.right;
  $('resWrong').textContent = G.wrong;
  $('resRate').textContent = answered ? rate + '%' : '—';
  $('resScoreK').textContent = '总用时';
  $('resScore').textContent = fmtMs(G.elapsed);
  $('resCombo').textContent = G.maxCombo;
  $('resAvg').textContent = answered ? avg.toFixed(1) + 's' : '—';

  var best = loadBest();
  var isNew = false;
  if(done && (!best.recite || G.elapsed < best.recite)){
    best.recite = G.elapsed;
    best.reciteRight = G.right;
    isNew = true;
  }
  if(isNew) saveBest(best);
  $('newRec').className = 'newrec' + (isNew ? '' : ' hidden');
  $('resBest').textContent = best.recite
    ? ('最快纪录：' + fmtMs(best.recite) + '（答对 ' + best.reciteRight + '/' + total + ' 句）')
    : '还没有口诀记录，完整背完一遍才算纪录';
  $('againSub').textContent = '再背一遍（45 句）';
  $('btnAgain').className = 'start-btn r';
  paintExport();
  show('scr-result');
}

function paintExport(){
  var ex = $('btnExport');
  if(!ex) return;
  if(G.wrongList.length){
    ex.disabled = false;
    ex.textContent = '导出错题（txt）· ' + G.wrongList.length + ' 道';
  }else{
    ex.disabled = true;
    ex.textContent = '本局没有错题，无需导出';
  }
}

/* ================= 错题导出 ================= */
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function nowStamp(){
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + '_'
       + pad2(d.getHours()) + pad2(d.getMinutes());
}
function buildWrongText(){
  /* 一行一题，Tab 分隔：Excel 打开时分隔符选「制表符」即可分列。
     题目放第一列，方便直接复制出来打印练习卷。
     口诀背诵模式的记录带「错误次数」，其他模式没有这一列。 */
  var hasCnt = false;
  for(var n=0;n<G.wrongList.length;n++){
    if(typeof G.wrongList[n].cnt === 'number'){ hasCnt = true; break; }
  }
  var L = [];
  var head = ['题目', '正确答案', '你的答案', '题号', '过程'];
  if(hasCnt) head.push('错误次数');
  L.push(head.join('\t'));
  for(var i=0;i<G.wrongList.length;i++){
    var w = G.wrongList[i];
    var proc = '';
    if(w.steps && w.steps.length > 1){
      var ps = [];
      for(var j=0;j<w.steps.length;j++) ps.push(w.steps[j].e + ' = ' + w.steps[j].v);
      proc = ps.join(' → ');
    }
    var row = [w.text, w.answer, (w.timeout ? '超时未答' : w.mine), w.no, proc];
    if(hasCnt) row.push(w.cnt || 1);
    L.push(row.join('\t'));
  }
  return L.join('\r\n');
}
function exportWrong(){
  if(!G.wrongList.length) return false;
  var txt = buildWrongText();
  var fname = 'kousuan_cuoti_' + nowStamp() + '.txt';
  try{
    /* 带 BOM，Windows 记事本打开中文不乱码 */
    var blob = new Blob(['\ufeff' + txt], {type: 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    return true;
  }catch(e){ return false; }
}

function goHome(){
  G.running = false; G.ended = true; G.accepting = false;
  stopLoop();
  paintBestLine();
  show('scr-home');
}

/* ================= 首页 UI ================= */
function paintChips(){
  var chips = document.querySelectorAll('#kindChips .chip');
  for(var i=0;i<chips.length;i++){
    var k = chips[i].getAttribute('data-k');
    var on = !!S.kinds[k];
    chips[i].className = 'chip' + (on ? ' on' : '');
    var inp = chips[i].querySelector('input');
    if(inp) inp.checked = on;
  }
  var kinds = activeKinds();
  var hasAS = (S.kinds['+'] || S.kinds['-']);
  var hasMD = (S.kinds['×'] || S.kinds['÷']);
  $('btnTime').disabled = !kinds.length;
  $('btnScore').disabled = !kinds.length;

  if(!kinds.length){
    $('kindHint').textContent = '至少选一种题目类型才能开始。';
  }else if(S.mix && hasAS && hasMD){
    $('kindHint').textContent = '已开启混合运算：会出现 6×3−5 这类题目。';
  }else if(S.mix){
    $('kindHint').textContent = '混合运算已勾选，但需要同时选择「加减」和「乘除」才会生效。';
  }else{
    $('kindHint').textContent = '当前题型：' + kinds.join(' ') + '（答案与中间过程都在 1–81 之间）';
  }
}

function normalizeLimit(){
  for(var i=0;i<LIMITS.length;i++){ if(LIMITS[i] === S.limit) return; }
  var best = LIMITS[0], bd = 999;
  for(var j=0;j<LIMITS.length;j++){
    var d = Math.abs(LIMITS[j] - S.limit);
    if(d < bd){ bd = d; best = LIMITS[j]; }
  }
  S.limit = best;
}

function paintLimitSeg(){
  var box = $('limitSeg');
  var html = '';
  for(var i=0;i<LIMITS.length;i++){
    var v = LIMITS[i];
    html += '<button data-v="' + v + '"' + (v === S.limit ? ' class="on"' : '') + '>' + v + '秒</button>';
  }
  box.innerHTML = html;
}

function paintBestLine(){
  var b = loadBest();
  var t = '计时模式最高：答对 ' + b.time + ' 题';
  var s = '积分模式最高：' + b.score + ' 分';
  var r = b.recite ? ('口诀最快：' + fmtMs(b.recite)) : '';
  $('bestLine').textContent = (b.time || b.score || b.recite)
    ? (t + ' ｜ ' + s + (r ? ' ｜ ' + r : ''))
    : '还没有记录，先来一局';
}

function flash2(txt){
  $('kindHint').textContent = txt;
  $('kindHint').style.color = 'var(--bad)';
  setTimeout(function(){ $('kindHint').style.color = ''; }, 1600);
}

/* ================= 事件 ================= */
document.addEventListener('click', function(e){
  var t = e.target;
  var chip = t.closest ? t.closest('.chip') : null;
  if(chip){
    var k = chip.getAttribute('data-k');
    S.kinds[k] = !S.kinds[k];
    saveSettings();
    paintChips();
    return;
  }
  var segBtn = t.closest ? t.closest('#limitSeg button') : null;
  if(segBtn){
    S.limit = parseInt(segBtn.getAttribute('data-v'), 10);
    saveSettings();
    paintLimitSeg();
    return;
  }
  var key = t.closest ? t.closest('.key') : null;
  if(key && !key.disabled){
    pressKey(key.getAttribute('data-d'));
  }
});

$('mixToggle').addEventListener('change', function(){
  S.mix = this.checked; saveSettings(); paintChips();
});
$('soundToggle').addEventListener('change', function(){
  S.sound = this.checked; saveSettings();
});
$('diffSel').addEventListener('change', function(){
  S.diff = parseInt(this.value, 10) || 0; saveSettings();
});

$('btnTime').addEventListener('click', function(){ startGame('time'); });
$('btnScore').addEventListener('click', function(){ startGame('score'); });
$('btnRecite').addEventListener('click', function(){ startGame('recite'); });
$('btnQuit').addEventListener('click', function(){
  if(G.running) endGame();
});
$('btnNext').addEventListener('click', function(){
  if(G.ended) return;
  G.paused = false;
  lastT = Date.now();
  if(G.mode === 'recite') advanceRecite(); else nextQuestion();
});
$('btnAgain').addEventListener('click', function(){ startGame(G.mode); });
$('btnHome').addEventListener('click', goHome);
$('btnExport').addEventListener('click', function(){ exportWrong(); });

/* 物理键盘 */
document.addEventListener('keydown', function(e){
  if(!$('scr-game').classList.contains('active')) return;
  var kcode = e.key;
  if(kcode >= '0' && kcode <= '9'){
    pressKey(kcode); e.preventDefault(); return;
  }
  if(kcode === 'Backspace'){ pressKey('del'); e.preventDefault(); return; }
  if(kcode === 'Enter' || kcode === '='){
    if($('nextRow').style.display === 'flex' && G.paused){ $('btnNext').click(); }
    else pressKey('ok');
    e.preventDefault();
  }
});

/* ================= 初始化 ================= */
loadSettings();
normalizeLimit();
paintLimitSeg();
paintChips();
paintBestLine();
$('mixToggle').checked = S.mix;
$('soundToggle').checked = S.sound;
$('diffSel').value = String(S.diff);

/* 测试钩子 */
window.__APP = {
  S: S, G: G,
  evalSeq: evalSeq, evalP: evalP, mk: mk, mkP: mkP,
  genAdd: genAdd, genSub: genSub, genMul: genMul, genDiv: genDiv, genMixed: genMixed,
  makeQuestion: makeQuestion, startGame: startGame, endGame: endGame,
  nextQuestion: nextQuestion, pressKey: pressKey, submit: submit,
  exportWrong: exportWrong, buildWrongText: buildWrongText,
  wrongList: function(){ return G.wrongList.slice(); },
  activeKinds: activeKinds, currentLevel: currentLevel, hasMixOp: hasMixOp,
  /* 口诀背诵模式 */
  startRecite: startRecite, reciteQueue: reciteQueue, fmtMs: fmtMs,
  advanceRecite: advanceRecite, nextRecite: nextRecite, endRecite: endRecite,
  state: function(){
    return { screen: (document.querySelector('.screen.active')||{}).id, mode: G.mode,
             score: G.score, right: G.right, wrong: G.wrong, combo: G.combo,
             level: currentLevel(), answer: G.q ? G.q.answer : null,
             qtext: G.q ? G.q.text : null, paused: G.paused,
             accepting: G.accepting, input: G.input,
             timeLeft: Math.round(G.timeLeft), qLeft: Math.round(G.qLeft),
             qi: G.qi, elapsed: Math.round(G.elapsed),
             queueLen: G.queue ? G.queue.length : 0,
             steps: G.q ? G.q.steps.length : 0 };
  }
};

})();
</script>
